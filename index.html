<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zebari TV Pro - Auto Loader</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');

  :root {
    --bg-body: #050608;
    --bg-card: rgba(20, 24, 34, 0.7);
    --primary: #ff003c;
    --primary-glow: rgba(255, 0, 60, 0.4);
    --text-main: #ffffff;
    --text-muted: #9ba1b1;
    --border: rgba(255, 255, 255, 0.08);
    --glass-blur: blur(12px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }

  body {
    background-color: var(--bg-body);
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(255, 0, 60, 0.08) 0%, transparent 30%),
      radial-gradient(circle at 90% 80%, rgba(0, 150, 255, 0.08) 0%, transparent 30%);
    color: var(--text-main);
    min-height: 100vh;
    padding-bottom: 30px;
  }

  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; background: rgba(5, 6, 8, 0.8); backdrop-filter: var(--glass-blur);
    position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border);
  }
  .logo { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .logo i { color: var(--primary); font-size: 20px; }
  .logo span { color: var(--primary); }
  .badge-pro { background: linear-gradient(45deg, #ff003c, #ff7a00); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; box-shadow: 0 0 10px var(--primary-glow); }

  .player-container { padding: 15px 20px; position: relative; }
  .video-wrapper { position: relative; background: #000; border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 9; box-shadow: 0 15px 35px rgba(0,0,0,0.6); border: 1px solid var(--border); }
  video { width: 100%; height: 100%; display: block; }

  .video-controls { position: absolute; top: 10px; left: 10px; display: flex; gap: 8px; z-index: 20; }
  .ctrl-btn { background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); color: #fff; border: 1px solid rgba(255,255,255,0.2); width: 36px; height: 36px; border-radius: 8px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.3s; font-size: 14px; }
  .ctrl-btn:hover { background: var(--primary); border-color: var(--primary); }

  .quality-menu {
    position: absolute; top: 55px; left: 10px;
    background: rgba(5, 6, 8, 0.9); backdrop-filter: blur(10px);
    border: 1px solid var(--border); border-radius: 8px;
    display: none; flex-direction: column; gap: 2px;
    padding: 5px; z-index: 30; min-width: 120px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
  }
  .quality-menu button { background: transparent; color: var(--text-main); border: none; padding: 8px 12px; text-align: right; border-radius: 4px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .quality-menu button:hover { background: rgba(255,255,255,0.1); }
  .quality-menu button.active { color: var(--primary); font-weight: bold; }

  .loading-overlay { position: absolute; inset: 0; background: rgba(5, 6, 8, 0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 15; }
  .spinner { width: 45px; height: 45px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { margin-top: 15px; font-size: 14px; color: var(--primary); font-weight: 600; }

  .search-container { padding: 10px 20px; }
  .search-inner { position: relative; }
  .search-inner i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
  .search-box { width: 100%; padding: 12px 40px 12px 15px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; color: var(--text-main); font-size: 14px; outline: none; }
  .search-box:focus { border-color: var(--primary); }

  .categories { display: flex; gap: 10px; padding: 10px 20px 15px; overflow-x: auto; scrollbar-width: none; }
  .categories::-webkit-scrollbar { display: none; }
  .cat-btn { background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border); padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; }
  .cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .channels-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; padding: 0 20px; }
  .channel-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 15px 10px; text-align: center; cursor: pointer; position: relative; overflow: hidden; }
  .channel-card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,0.2); }
  .channel-card.active { border-color: var(--primary); background: linear-gradient(180deg, rgba(255,0,60,0.1) 0%, var(--bg-card) 100%); }

  .fav-btn { position: absolute; top: 8px; left: 8px; background: transparent; border: none; color: #555; font-size: 16px; cursor: pointer; z-index: 5; }
  .fav-btn.active { color: #ffd700; }

  .channel-icon { height: 60px; display: flex; justify-content: center; align-items: center; margin-bottom: 10px; color: #fff; }
  .channel-logo { max-width: 60px; max-height: 60px; border-radius: 8px; object-fit: contain; }

  .channel-name { font-size: 13px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .channel-cat { font-size: 11px; color: var(--text-muted); }

  #toast-container { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; pointer-events: none; }
  .toast { background: rgba(255, 0, 60, 0.9); color: #fff; padding: 12px 15px; border-radius: 10px; font-size: 13px; font-weight: 600; animation: slideDown 0.3s ease forwards; }
  @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .no-results { grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted); }
</style>
</head>
<body>

<div id="toast-container"></div>

<header>
  <div class="logo">
    <i class="fa-solid fa-tv"></i> Zebari <span>TV</span>
  </div>
  <div class="badge-pro">AUTO M3U</div>
</header>

<div class="player-container">
  <div class="video-wrapper">
    <video id="videoPlayer" controls playsinline></video>
    <div class="video-controls">
      <button class="ctrl-btn" onclick="toggleFullscreen()"><i class="fa-solid fa-expand"></i></button>
      <button class="ctrl-btn" onclick="togglePiP()"><i class="fa-solid fa-clone"></i></button>
      <button class="ctrl-btn" onclick="toggleQualityMenu(event)"><i class="fa-solid fa-gear"></i></button>
    </div>
    <div class="quality-menu" id="qualityMenu"></div>
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-text">جاري الاتصال...</div>
    </div>
  </div>
</div>

<div class="search-container">
  <div class="search-inner">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن قناة...">
  </div>
</div>

<div class="categories" id="categoriesContainer">
  <div style="padding: 10px; color: #888;">جاري تحميل القنوات، يرجى الانتظار...</div>
</div>
<div class="channels-grid" id="channelsContainer"></div>

<script>
  // =========================================================
  // ⚠️ ضع رابط قائمة M3U الخاص بك هنا
  // =========================================================
  const M3U_URL = 'https://iptvmate.net/files/xxx.m3u'; 

  let channelsList = [];
  let hls = null;
  let currentCategory = 'الكل';
  let currentSearch = '';
  let currentPlayingId = null;

  const video = document.getElementById('videoPlayer');
  const container = document.getElementById('channelsContainer');
  const loadingOverlay = document.getElementById('loadingOverlay');
  const qualityMenu = document.getElementById('qualityMenu');
  const catContainer = document.getElementById('categoriesContainer');

  let favorites = JSON.parse(localStorage.getItem('zebari_favs')) || [];

  // 1. دالة جلب القنوات (تمت إضافة كود منع التخزين المؤقت Cache Busting)
  async function loadM3UPlaylist() {
    try {
      // إضافة ?t=... يجبر المتصفح على جلب النسخة الأحدث دائماً
      const cacheBusterUrl = M3U_URL + (M3U_URL.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
      
      const response = await fetch(cacheBusterUrl);
      const text = await response.text();
      parseM3U(text);
    } catch (error) {
      catContainer.innerHTML = '<div style="color:red; padding:10px;">تعذر تحميل القنوات. تأكد من الرابط والإنترنت.</div>';
      showToast('فشل تحميل القنوات');
    }
  }

  // 2. دالة تحليل ملف M3U
  function parseM3U(m3uContent) {
    const lines = m3uContent.split('\n');
    let idCounter = 1;
    let currentInfo = {};
    const categoriesSet = new Set(['الكل', 'المفضلة']);

    for (let i = 0; i < lines.length; i++) {
      let line = lines[i].trim();
      
      if (line.startsWith('#EXTINF:')) {
        const nameMatch = line.match(/,(.*)$/);
        currentInfo.name = nameMatch ? nameMatch[1].trim() : 'قناة بدون اسم';
        
        const groupMatch = line.match(/group-title="([^"]+)"/);
        currentInfo.cat = groupMatch ? groupMatch[1] : 'عام';
        categoriesSet.add(currentInfo.cat);
        
        const logoMatch = line.match(/tvg-logo="([^"]+)"/);
        currentInfo.logo = logoMatch ? logoMatch[1] : '';
      } 
      else if (line.startsWith('http')) {
        if (currentInfo.name) {
          channelsList.push({
            id: idCounter++,
            name: currentInfo.name,
            cat: currentInfo.cat,
            logo: currentInfo.logo,
            icon: 'fa-solid fa-tv',
            urls: [line]
          });
        }
        currentInfo = {};
      }
    }

    renderCategories(Array.from(categoriesSet));
    updateView();
  }

  // --- دوال الواجهة والتشغيل ---
  
  document.addEventListener('click', (e) => {
    if (!qualityMenu.contains(e.target) && !e.target.closest('.ctrl-btn')) {
        qualityMenu.style.display = 'none';
    }
  });

  function toggleQualityMenu(event) {
    event.stopPropagation();
    qualityMenu.style.display = qualityMenu.style.display === 'flex' ? 'none' : 'flex';
  }

  function populateQualityMenu() {
    qualityMenu.innerHTML = '';
    if (!hls || !hls.levels || hls.levels.length === 0) {
        qualityMenu.innerHTML = '<button disabled>جودة واحدة (تلقائي)</button>';
        return;
    }
    const autoBtn = document.createElement('button');
    autoBtn.innerText = 'تلقائي (Auto)';
    autoBtn.className = hls.currentLevel === -1 ? 'active' : '';
    autoBtn.onclick = () => setQuality(-1);
    qualityMenu.appendChild(autoBtn);

    hls.levels.forEach((level, index) => {
        const btn = document.createElement('button');
        btn.innerText = level.height ? level.height + 'p' : 'مستوى ' + (index + 1);
        btn.className = hls.currentLevel === index ? 'active' : '';
        btn.onclick = () => setQuality(index);
        qualityMenu.appendChild(btn);
    });
  }

  function setQuality(levelIndex) {
    if (hls) {
        hls.currentLevel = levelIndex;
        populateQualityMenu();
        qualityMenu.style.display = 'none';
    }
  }

  function renderCategories(categories) {
    catContainer.innerHTML = '';
    categories.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = `cat-btn ${cat === 'الكل' ? 'active' : ''}`;
      if (cat === 'المفضلة') {
        btn.innerHTML = `<i class="fa-solid fa-star" style="color:#ffd700; font-size:10px;"></i> ${cat}`;
      } else {
        btn.innerText = cat;
      }
      btn.onclick = () => filterByCategory(cat, btn);
      catContainer.appendChild(btn);
    });
  }

  function toggleFavorite(channelUrl, event) {
    event.stopPropagation();
    if (favorites.includes(channelUrl)) {
      favorites = favorites.filter(url => url !== channelUrl);
      showToast('تمت الإزالة من المفضلة');
    } else {
      favorites.push(channelUrl);
      showToast('تمت الإضافة إلى المفضلة');
    }
    localStorage.setItem('zebari_favs', JSON.stringify(favorites));
    updateView();
  }

  function showToast(message) {
    const toast = document.createElement('div');
    toast.className = `toast`;
    toast.innerHTML = `<span>${message}</span>`;
    document.getElementById('toast-container').appendChild(toast);
    setTimeout(() => {
      toast.style.animation = 'slideDown 0.3s ease reverse forwards';
      setTimeout(() => toast.remove(), 300);
    }, 3000);
  }

  function renderChannels(channels) {
    container.innerHTML = '';
    if (channels.length === 0) {
      container.innerHTML = '<div class="no-results">لا توجد قنوات مطابقة</div>';
      return;
    }

    const displayLimit = 300; 
    const displayChannels = channels.slice(0, displayLimit);

    displayChannels.forEach(ch => {
      const isFav = favorites.includes(ch.urls[0]);
      const card = document.createElement('div');
      card.className = `channel-card ${currentPlayingId === ch.id ? 'active' : ''}`;
      
      card.innerHTML = `
        <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite('${ch.urls[0]}', event)">
          <i class="fa-solid fa-star"></i>
        </button>
        <span class="channel-icon">
            ${ch.logo ? `<img src="${ch.logo}" class="channel-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">` : ''}
            <i class="${ch.icon}" style="${ch.logo ? 'display:none;' : ''} font-size:26px;"></i>
        </span>
        <div class="channel-name">${ch.name}</div>
        <div class="channel-cat">${ch.cat}</div>
      `;
      card.onclick = () => selectChannel(ch);
      container.appendChild(card);
    });
  }

  function filterByCategory(cat, btn) {
    currentCategory = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('searchInput').value = '';
    currentSearch = '';
    updateView();
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    currentSearch = e.target.value;
    updateView();
  });

  function updateView() {
    let filtered = channelsList;
    if (currentCategory === 'المفضلة') {
      filtered = filtered.filter(ch => favorites.includes(ch.urls[0]));
    } else if (currentCategory !== 'الكل') {
      filtered = filtered.filter(ch => ch.cat === currentCategory);
    }
    if (currentSearch) {
      const query = currentSearch.toLowerCase();
      filtered = filtered.filter(ch => ch.name.toLowerCase().includes(query) || ch.cat.toLowerCase().includes(query));
    }
    renderChannels(filtered);
  }

  function selectChannel(channel) {
    currentPlayingId = channel.id;
    updateView();

    let rawUrl = channel.urls[0];
    loadingOverlay.style.display = 'flex';
    qualityMenu.innerHTML = '';
    qualityMenu.style.display = 'none';

    if (hls) { hls.destroy(); hls = null; }
    video.pause();
    video.removeAttribute('src');
    video.load();

    let finalUrl = rawUrl;
    if (finalUrl.startsWith('http://')) {
        finalUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(rawUrl);
    }

    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ enableWorker: true, lowLatencyMode: true });
      hls.loadSource(finalUrl);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        loadingOverlay.style.display = 'none';
        populateQualityMenu();
        video.play().catch(() => showToast('اضغط ▶ للتشغيل'));
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
             loadingOverlay.style.display = 'none';
             showToast('تعذر تشغيل القناة (السيرفر لا يستجيب)');
             hls.destroy(); hls = null;
             currentPlayingId = null;
             updateView();
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = finalUrl;
      video.addEventListener('loadedmetadata', () => {
        loadingOverlay.style.display = 'none';
        video.play();
      });
    } else {
      loadingOverlay.style.display = 'none';
      showToast('متصفحك لا يدعم HLS');
    }
  }

  function toggleFullscreen() {
    const wrap = document.querySelector('.video-wrapper');
    if (!document.fullscreenElement) {
      (wrap.requestFullscreen || wrap.webkitRequestFullscreen).call(wrap);
    } else {
      document.exitFullscreen();
    }
  }

  function togglePiP() {
    if (document.pictureInPictureElement) {
      document.exitPictureInPicture().catch(err => console.log(err));
    } else if (video !== document.pictureInPictureElement) {
      video.requestPictureInPicture().catch(err => showToast('لا يدعم الصورة داخل صورة'));
    }
  }

  loadM3UPlaylist();
</script>
</body>
</html>

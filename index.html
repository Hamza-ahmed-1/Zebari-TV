<html lang="ar" dir="rtl">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zebari TV Pro - Nilesat & Multi-Server</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');

  :root {
    --bg-body: #050608;
    --bg-card: rgba(20, 24, 34, 0.7);
    --primary: #ff003c;
    --primary-glow: rgba(255, 0, 60, 0.4);
    --text-main: #ffffff;
    --text-muted: #9ba1b1;
    --border: rgba(255, 255, 255, 0.08);
    --glass-blur: blur(12px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }

  body {
    background-color: var(--bg-body);
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(255, 0, 60, 0.08) 0%, transparent 30%),
      radial-gradient(circle at 90% 80%, rgba(0, 150, 255, 0.08) 0%, transparent 30%);
    color: var(--text-main);
    min-height: 100vh;
    padding-bottom: 30px;
  }

  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; background: rgba(5, 6, 8, 0.8); backdrop-filter: var(--glass-blur);
    position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border);
  }
  .logo { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .logo i { color: var(--primary); font-size: 20px; }
  .logo span { color: var(--primary); }
  .badge-pro { background: linear-gradient(45deg, #ff003c, #ff7a00); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; box-shadow: 0 0 10px var(--primary-glow); }

  .player-container { padding: 15px 20px; position: relative; }
  .video-wrapper { position: relative; background: #000; border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 9; box-shadow: 0 15px 35px rgba(0,0,0,0.6); border: 1px solid var(--border); }
  video { width: 100%; height: 100%; display: block; }

  .video-controls { position: absolute; top: 10px; left: 10px; display: flex; gap: 8px; z-index: 20; }
  .ctrl-btn { background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); color: #fff; border: 1px solid rgba(255,255,255,0.2); width: 36px; height: 36px; border-radius: 8px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.3s; font-size: 14px; }
  .ctrl-btn:hover { background: var(--primary); border-color: var(--primary); }
  .ctrl-btn.server-btn { color: #00ffaa; border-color: rgba(0, 255, 170, 0.3); }
  .ctrl-btn.server-btn:hover { background: #00ffaa; color: #000; }

  .quality-menu {
    position: absolute; top: 55px; left: 10px;
    background: rgba(5, 6, 8, 0.9); backdrop-filter: blur(10px);
    border: 1px solid var(--border); border-radius: 8px;
    display: none; flex-direction: column; gap: 2px;
    padding: 5px; z-index: 30; min-width: 120px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
  }
  .quality-menu button {
    background: transparent; color: var(--text-main); border: none;
    padding: 8px 12px; text-align: right; border-radius: 4px;
    font-size: 13px; cursor: pointer; font-family: inherit; transition: 0.2s;
  }
  .quality-menu button:hover { background: rgba(255,255,255,0.1); }
  .quality-menu button.active { color: var(--primary); font-weight: bold; background: rgba(255,0,60,0.1); }

  .loading-overlay { position: absolute; inset: 0; background: rgba(5, 6, 8, 0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 15; }
  .spinner { width: 45px; height: 45px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; box-shadow: 0 0 15px var(--primary-glow); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { margin-top: 15px; font-size: 14px; color: var(--primary); font-weight: 600; letter-spacing: 1px; }

  .search-container { padding: 10px 20px; }
  .search-inner { position: relative; }
  .search-inner i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
  .search-box { width: 100%; padding: 12px 40px 12px 15px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; color: var(--text-main); font-size: 14px; outline: none; transition: 0.3s; backdrop-filter: var(--glass-blur); }
  .search-box:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }

  .categories { display: flex; gap: 10px; padding: 10px 20px 15px; overflow-x: auto; scrollbar-width: none; }
  .categories::-webkit-scrollbar { display: none; }
  .cat-btn { background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border); padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; transition: 0.3s; backdrop-filter: var(--glass-blur); }
  .cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }

  .channels-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; padding: 0 20px; }
  .channel-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 15px 10px; text-align: center; cursor: pointer; transition: all 0.3s ease; position: relative; backdrop-filter: var(--glass-blur); overflow: hidden; }
  .channel-card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,0.2); }
  .channel-card.active { border-color: var(--primary); box-shadow: 0 8px 20px var(--primary-glow); background: linear-gradient(180deg, rgba(255,0,60,0.1) 0%, var(--bg-card) 100%); }

  .fav-btn { position: absolute; top: 8px; left: 8px; background: transparent; border: none; color: #555; font-size: 16px; cursor: pointer; transition: 0.3s; z-index: 5; padding: 5px; }
  .fav-btn.active { color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }

  .live-dot { position: absolute; top: 12px; right: 12px; width: 8px; height: 8px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 8px var(--primary); }
  
  .channel-icon { height: 60px; display: flex; justify-content: center; align-items: center; margin-bottom: 10px; color: #fff; }
  .channel-logo { max-width: 60px; max-height: 60px; border-radius: 8px; object-fit: contain; }

  .channel-name { font-size: 13px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .channel-cat { font-size: 11px; color: var(--text-muted); }

  #toast-container { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; pointer-events: none; }
  .toast { background: rgba(255, 0, 60, 0.9); backdrop-filter: blur(10px); color: #fff; padding: 12px 15px; border-radius: 10px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); animation: slideDown 0.3s ease forwards; border-left: 4px solid #fff; }
  .toast.success { background: rgba(0, 200, 100, 0.9); }
  .toast.info { background: rgba(0, 150, 255, 0.9); }
  @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .no-results { grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted); font-size: 15px; }
  .no-results i { font-size: 40px; margin-bottom: 15px; opacity: 0.5; display: block; }
</style>

<div id="toast-container"></div>

<header>

    <div class="video-controls">

      <button class="ctrl-btn server-btn" onclick="switchServer()" title="تبديل السيرفر"><i class="fa-solid fa-server"></i></button>
    </div>

    <div class="quality-menu" id="qualityMenu"></div>

      <div class="loading-text" id="loadingText">جاري الاتصال بالسيرفر 1...</div>
    </div>
  </div>
</div>

    // ==================== القنوات الرياضية ====================
    { id: 40, name: "beIN SPORTS News", cat: "رياضة", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/BeIN_Sports_Logo.png/240px-Bein_Sports_Logo.png", icon: "fa-solid fa-futbol", urls: ["https://ch.iptvmate.net/416c659759389f6720202a9de9c16572.m3u8", "http://31.220.1.190:8080/live/WuYC3qhd9/65udrOt48Y/198000.m3u8", "https://ch.iptvmate.net/0c7fff6483ba64fc51e25ec7368b09fd.m3u8"] },
    { id: 41, name: "beIN SPORTS 1", cat: "رياضة", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/BeIN_Sports_Logo.png/240px-Bein_Sports_Logo.png", icon: "fa-solid fa-futbol", urls: ["https://ch.iptvmate.net/0c7fff6483ba64fc51e25ec7368b09fd.m3u8"] },
    { id: 42, name: "beIN SPORTS 2", cat: "رياضة", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/BeIN_Sports_Logo.png/240px-Bein_Sports_Logo.png", icon: "fa-solid fa-futbol", urls: ["https://ch.iptvmate.net/5cde4a4781da1ead66a8c5a98ef888a7.m3u8"] }
  ];

  let hls = null;
  let currentCategory = 'الكل';
  let currentSearch = '';
  let currentPlayingId = null;
  
  let activeChannel = null;
  let currentServerIndex = 0;
  let isTryingFallback = false;

  const video = document.getElementById('videoPlayer');
  const container = document.getElementById('channelsContainer');
  const loadingOverlay = document.getElementById('loadingOverlay');
  const loadingText = document.getElementById('loadingText');
  const qualityMenu = document.getElementById('qualityMenu');

  let favorites = JSON.parse(localStorage.getItem('zebari_favs')) || [];

  document.addEventListener('click', (e) => {
    if (!qualityMenu.contains(e.target) && !e.target.closest('.ctrl-btn')) {
        qualityMenu.style.display = 'none';
    }
  });

  function toggleQualityMenu(event) {
    event.stopPropagation();
    qualityMenu.style.display = qualityMenu.style.display === 'flex' ? 'none' : 'flex';
  }

  function populateQualityMenu() {
    qualityMenu.innerHTML = '';
    if (!hls || !hls.levels || hls.levels.length === 0) {
        qualityMenu.innerHTML = '<button disabled>جودة واحدة (تلقائي)</button>';
        return;
    }
    const autoBtn = document.createElement('button');
    autoBtn.innerText = 'تلقائي (Auto)';
    autoBtn.className = hls.currentLevel === -1 ? 'active' : '';
    autoBtn.onclick = () => setQuality(-1);
    qualityMenu.appendChild(autoBtn);

    hls.levels.forEach((level, index) => {
        const btn = document.createElement('button');
        const height = level.height ? level.height + 'p' : 'مستوى ' + (index + 1);
        btn.innerText = height;
        btn.className = hls.currentLevel === index ? 'active' : '';
        btn.onclick = () => setQuality(index);
        qualityMenu.appendChild(btn);
    });
  }

  function setQuality(levelIndex) {
    if (hls) {
        hls.currentLevel = levelIndex;
        populateQualityMenu();
        qualityMenu.style.display = 'none';
    }
  }

  function renderCategories() {
    const catContainer = document.getElementById('categoriesContainer');
    catContainer.innerHTML = '';
    const categoriesSet = new Set(['الكل', 'المفضلة']);
    channelsList.forEach(ch => categoriesSet.add(ch.cat));
    
    Array.from(categoriesSet).forEach(cat => {
      const btn = document.createElement('button');
      btn.className = `cat-btn ${cat === 'الكل' ? 'active' : ''}`;
      if (cat === 'المفضلة') {
        btn.innerHTML = `<i class="fa-solid fa-star" style="color:#ffd700; font-size:10px;"></i> ${cat}`;
      } else {
        btn.innerText = cat;
      }
      btn.onclick = () => filterByCategory(cat, btn);
      catContainer.appendChild(btn);
    });
  }

  function toggleFavorite(channelUrl, event) {
    event.stopPropagation();
    if (favorites.includes(channelUrl)) {
      favorites = favorites.filter(url => url !== channelUrl);
      showToast('تمت الإزالة من المفضلة', 'info');
    } else {
      favorites.push(channelUrl);
      showToast('تمت الإضافة إلى المفضلة', 'success');
    }
    localStorage.setItem('zebari_favs', JSON.stringify(favorites));
    updateView();
  }

  function showToast(message, type = 'error') {
    const toast = document.createElement('div');
    toast.className = `toast ${type === 'success' ? 'success' : type === 'info' ? 'info' : ''}`;
    const icon = type === 'success' ? '<i class="fa-solid fa-check-circle"></i>' : type === 'info' ? '<i class="fa-solid fa-circle-info"></i>' : '<i class="fa-solid fa-triangle-exclamation"></i>';
    toast.innerHTML = `${icon} <span>${message}</span>`;
    document.getElementById('toast-container').appendChild(toast);
    setTimeout(() => {
      toast.style.animation = 'slideDown 0.3s ease reverse forwards';
      setTimeout(() => toast.remove(), 300);
    }, 3000);
  }

  function renderChannels(channels) {
    container.innerHTML = '';
    if (channels.length === 0) {
      container.innerHTML = '<div class="no-results"><i class="fa-solid fa-satellite"></i>لا توجد قنوات مطابقة</div>';
      return;
    }

    channels.forEach(ch => {
      const isFav = favorites.includes(ch.urls[0]);
      const card = document.createElement('div');
      card.className = `channel-card ${currentPlayingId === ch.id ? 'active' : ''}`;
      
      card.innerHTML = `
        <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite('${ch.urls[0]}', event)">
          <i class="fa-solid fa-star"></i>
        </button>
        ${currentPlayingId === ch.id ? '<div class="live-dot"></div>' : ''}
        <span class="channel-icon">
            <img src="${ch.logo}" alt="${ch.name}" class="channel-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <i class="${ch.icon}" style="display:none; font-size:26px;"></i>
        </span>
        <div class="channel-name">${ch.name}</div>
        <div class="channel-cat">${ch.cat} ${ch.urls.length > 1 ? `(${ch.urls.length} سيرفر)` : ''}</div>
      `;
      card.onclick = () => selectChannel(ch);
      container.appendChild(card);
    });
  }

  function filterByCategory(cat, btn) {
    currentCategory = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('searchInput').value = '';
    currentSearch = '';
    updateView();
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    currentSearch = e.target.value;
    updateView();
  });

  function updateView() {
    let filtered = channelsList;
    if (currentCategory === 'المفضلة') {
      filtered = filtered.filter(ch => favorites.includes(ch.urls[0]));
    } else if (currentCategory !== 'الكل') {
      filtered = filtered.filter(ch => ch.cat === currentCategory);
    }
    if (currentSearch) {
      const query = currentSearch.toLowerCase();
      filtered = filtered.filter(ch => ch.name.toLowerCase().includes(query) || ch.cat.toLowerCase().includes(query));
    }
    renderChannels(filtered);
  }

  function selectChannel(channel) {
    activeChannel = channel;
    currentServerIndex = 0;
    isTryingFallback = false;
    
    currentPlayingId = channel.id;
    updateView();
    
    playCurrentServer();
  }

  function switchServer() {
    if (!activeChannel || activeChannel.urls.length <= 1) {
        showToast('هذه القناة لا تمتلك سيرفرات بديلة', 'info');
        return;
    }
    
    currentServerIndex++;
    if (currentServerIndex >= activeChannel.urls.length) {
        currentServerIndex = 0;
    }
    
    isTryingFallback = false;
    showToast(`جاري التحويل إلى السيرفر ${currentServerIndex + 1}`, 'info');
    playCurrentServer();
  }

  function playCurrentServer() {
    if (!activeChannel) return;

    let rawUrl = activeChannel.urls[currentServerIndex];
    
    loadingText.textContent = `جاري الاتصال بالسيرفر ${currentServerIndex + 1}...`;
    loadingOverlay.style.display = 'flex';
    qualityMenu.innerHTML = '';
    qualityMenu.style.display = 'none';

    if (hls) { hls.destroy(); hls = null; }
    video.pause();
    video.removeAttribute('src');
    video.load();

    let finalUrl = rawUrl;
    if (finalUrl.startsWith('http://')) {
        finalUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(rawUrl);
    }

    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ enableWorker: true, lowLatencyMode: true });
      hls.loadSource(finalUrl);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        loadingOverlay.style.display = 'none';
        populateQualityMenu();
        video.play().catch(() => showToast('المتصفح منع التشغيل التلقائي، اضغط ▶', 'error'));
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR || data.type === Hls.ErrorTypes.MEDIA_ERROR) {
             
             if (!isTryingFallback) {
                 showToast('السيرفر الحالي لا يعمل، جاري تجربة السيرفر البديل...', 'error');
                 isTryingFallback = true;
                 
                 currentServerIndex++;
                 if (currentServerIndex >= activeChannel.urls.length) {
                     currentServerIndex = 0;
                     loadingOverlay.style.display = 'none';
                     showToast('جميع السيرفرات لهذه القناة معطلة حالياً', 'error');
                     hls.destroy(); hls = null;
                     currentPlayingId = null;
                     updateView();
                     return;
                 }
                 
                 playCurrentServer();
             } else {
                 loadingOverlay.style.display = 'none';
                 showToast('تعذر تشغيل القناة (السيرفرات لا تستجيب)', 'error');
                 hls.destroy(); hls = null;
                 currentPlayingId = null;
                 updateView();
             }
          }
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = finalUrl;
      video.addEventListener('loadedmetadata', () => {
        loadingOverlay.style.display = 'none';
        video.play();
      });
    } else {
      loadingOverlay.style.display = 'none';
      showToast('متصفحك لا يدعم تقنية HLS', 'error');
    }
  }

  function toggleFullscreen() {
    const wrap = document.querySelector('.video-wrapper');
    if (!document.fullscreenElement) {
      (wrap.requestFullscreen || wrap.webkitRequestFullscreen).call(wrap);
    } else {
      document.exitFullscreen();
    }
  }

  function togglePiP() {
    if (document.pictureInPictureElement) {
      document.exitPictureInPicture().catch(err => console.log(err));
    } else if (video !== document.pictureInPictureElement) {
      video.requestPictureInPicture().catch(err => showToast('المتصفح لا يدعم الصورة داخل صورة', 'error'));
    }
  }

  renderCategories();
  updateView();
</script>

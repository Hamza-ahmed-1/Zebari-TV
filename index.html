<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zebari TV Pro - EPG Enabled</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
  :root { --bg-body: #050608; --bg-card: rgba(20, 24, 34, 0.7); --primary: #ff003c; --text-main: #ffffff; --text-muted: #9ba1b1; --border: rgba(255,255,255,0.08); }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
  body { background-color: var(--bg-body); color: var(--text-main); min-height: 100vh; padding-bottom: 30px; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: rgba(5, 6, 8, 0.8); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
  .logo { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .logo i { color: var(--primary); } .logo span { color: var(--primary); }
  .badge-pro { background: linear-gradient(45deg, #ff003c, #ff7a00); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; }
  .player-container { padding: 15px 20px; position: relative; }
  .video-wrapper { position: relative; background: #000; border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 9; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
  video { width: 100%; height: 100%; display: block; }
  .video-controls { position: absolute; top: 10px; left: 10px; display: flex; gap: 8px; z-index: 20; }
  .ctrl-btn { background: rgba(0,0,0,0.5); color: #fff; border: 1px solid rgba(255,255,255,0.2); width: 36px; height: 36px; border-radius: 8px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
  .loading-overlay { position: absolute; inset: 0; background: rgba(5, 6, 8, 0.8); display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 15; }
  .spinner { width: 45px; height: 45px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { margin-top: 15px; font-size: 14px; color: var(--primary); font-weight: 600; }
  /* شريط EPG */
  .epg-bar { display: none; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; margin: 10px 20px 0; padding: 12px 15px; flex-direction: column; gap: 5px; }
  .epg-title { font-size: 13px; font-weight: 700; color: var(--primary); }
  .epg-program { font-size: 14px; font-weight: 600; color: var(--text-main); }
  .epg-next { font-size: 12px; color: var(--text-muted); }
  .search-container { padding: 10px 20px; }
  .search-inner { position: relative; } .search-inner i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
  .search-box { width: 100%; padding: 12px 40px 12px 15px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; color: var(--text-main); outline: none; }
  .categories { display: flex; gap: 10px; padding: 10px 20px 15px; overflow-x: auto; scrollbar-width: none; }
  .cat-btn { background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border); padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; }
  .cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .channels-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; padding: 0 20px; }
  .channel-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 15px 10px; text-align: center; cursor: pointer; position: relative; }
  .channel-card.active { border-color: var(--primary); background: linear-gradient(180deg, rgba(255,0,60,0.1) 0%, var(--bg-card) 100%); }
  .channel-icon { height: 60px; display: flex; justify-content: center; align-items: center; margin-bottom: 10px; }
  .channel-logo { max-width: 60px; max-height: 60px; border-radius: 8px; object-fit: contain; }
  .channel-name { font-size: 13px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .channel-cat { font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>

<header>
  <div class="logo"><i class="fa-solid fa-tv"></i> Zebari <span>TV</span></div>
  <div class="badge-pro">EPG ACTIVE</div>
</header>

<div class="player-container">
  <div class="video-wrapper">
    <video id="videoPlayer" controls playsinline></video>
    <div class="video-controls">
      <button class="ctrl-btn" onclick="toggleFullscreen()"><i class="fa-solid fa-expand"></i></button>
    </div>
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-text">جاري الاتصال...</div>
    </div>
  </div>
</div>

<!-- شريط عرض دليل البرامج -->
<div class="epg-bar" id="epgBar">
  <div class="epg-title">الآن على الشاشة:</div>
  <div class="epg-program" id="epgNow">جاري تحميل دليل البرامج...</div>
  <div class="epg-next" id="epgNext"></div>
</div>

<div class="search-container">
  <div class="search-inner">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن قناة...">
  </div>
</div>

<div class="categories" id="categoriesContainer"><div style="padding: 10px; color: #888;">جاري تحميل القنوات...</div></div>
<div class="channels-grid" id="channelsContainer"></div>

<script>
  // =========================================================
  // الروابط الأساسية
  // =========================================================
  const M3U_URL = 'https://iptv-org.github.io/iptv/countries/es.m3u'; // قنوات إسبانيا لتتناسب مع EPG
  const EPG_URL = 'https://iptv-org.github.io/epg/guides/es.xml'; // رابط دليل البرامج

  let channelsList = [];
  let epgData = {}; // لتخزين بيانات EPG
  let hls = null;
  let currentCategory = 'الكل';
  let currentSearch = '';
  let currentPlayingId = null;

  const video = document.getElementById('videoPlayer');
  const container = document.getElementById('channelsContainer');
  const loadingOverlay = document.getElementById('loadingOverlay');
  const catContainer = document.getElementById('categoriesContainer');
  const epgBar = document.getElementById('epgBar');
  const epgNow = document.getElementById('epgNow');
  const epgNext = document.getElementById('epgNext');

  // 1. جلب القنوات من M3U
  async function loadM3UPlaylist() {
    try {
      const response = await fetch(M3U_URL);
      const text = await response.text();
      parseM3U(text);
    } catch (error) {
      catContainer.innerHTML = '<div style="color:red; padding:10px;">تعذر تحميل القنوات.</div>';
    }
  }

  // 2. تحليل M3U واستخراج tvg-id
  function parseM3U(m3uContent) {
    const lines = m3uContent.split('\n');
    let idCounter = 1;
    let currentInfo = {};
    const categoriesSet = new Set(['الكل']);

    for (let i = 0; i < lines.length; i++) {
      let line = lines[i].trim();
      if (line.startsWith('#EXTINF:')) {
        const nameMatch = line.match(/,(.*)$/);
        currentInfo.name = nameMatch ? nameMatch[1].trim() : 'قناة';
        
        const groupMatch = line.match(/group-title="([^"]+)"/);
        currentInfo.cat = groupMatch ? groupMatch[1] : 'عام';
        categoriesSet.add(currentInfo.cat);
        
        const logoMatch = line.match(/tvg-logo="([^"]+)"/);
        currentInfo.logo = logoMatch ? logoMatch[1] : '';

        // استخراج tvg-id لربطه بـ EPG
        const idMatch = line.match(/tvg-id="([^"]+)"/);
        currentInfo.tvgId = idMatch ? idMatch[1] : '';
      } 
      else if (line.startsWith('http')) {
        if (currentInfo.name) {
          channelsList.push({
            id: idCounter++,
            name: currentInfo.name,
            cat: currentInfo.cat,
            logo: currentInfo.logo,
            tvgId: currentInfo.tvgId,
            url: line
          });
        }
        currentInfo = {};
      }
    }
    renderCategories(Array.from(categoriesSet));
    updateView();
  }

  // 3. جلب وتحليل دليل البرامج XML
  async function loadEPG() {
    try {
      const response = await fetch(EPG_URL);
      const xmlText = await response.text();
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "text/xml");

      // تحويل XML إلى كائن JS للوصول السريع
      const programmes = xmlDoc.getElementsByTagName("programme");
      for (let i = 0; i < programmes.length; i++) {
        const prog = programmes[i];
        const channelId = prog.getAttribute("channel");
        const start = prog.getAttribute("start");
        const title = prog.getElementsByTagName("title")[0]?.textContent || '';

        if (!epgData[channelId]) epgData[channelId] = [];
        epgData[channelId].push({ start, title });
      }
      console.log("تم تحميل دليل البرامج بنجاح");
    } catch (error) {
      console.error("فشل تحميل EPG:", error);
    }
  }

  // 4. عرض البرنامج الحالي على الشاشة
  function showEPGForChannel(channel) {
    epgBar.style.display = 'flex';
    
    if (!channel.tvgId || !epgData[channel.tvgId]) {
      epgNow.textContent = "لا تتوفر معلومات برامج لهذه القناة.";
      epgNext.textContent = "";
      return;
    }

    const programs = epgData[channel.tvgId];
    const now = new Date();
    let currentProg = null;
    let nextProg = null;

    // البحث عن البرنامج الحالي (مبسط)
    for (let i = 0; i < programs.length; i++) {
      const startTime = new Date(programs[i].start);
      const endTime = programs[i+1] ? new Date(programs[i+1].start) : new Date(startTime.getTime() + 3600000);
      
      if (now >= startTime && now < endTime) {
        currentProg = programs[i];
        nextProg = programs[i+1];
        break;
      }
    }

    if (currentProg) {
      epgNow.textContent = currentProg.title;
      epgNext.textContent = nextProg ? `التالي: ${nextProg.title}` : '';
    } else {
      epgNow.textContent = "لا يوجد برنامج حالي.";
      epgNext.textContent = "";
    }
  }

  // دوال الواجهة والتشغيل
  function renderCategories(categories) {
    catContainer.innerHTML = '';
    categories.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = `cat-btn ${cat === 'الكل' ? 'active' : ''}`;
      btn.innerText = cat;
      btn.onclick = () => filterByCategory(cat, btn);
      catContainer.appendChild(btn);
    });
  }

  function filterByCategory(cat, btn) {
    currentCategory = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('searchInput').value = '';
    currentSearch = '';
    updateView();
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    currentSearch = e.target.value;
    updateView();
  });

  function updateView() {
    let filtered = channelsList;
    if (currentCategory !== 'الكل') filtered = filtered.filter(ch => ch.cat === currentCategory);
    if (currentSearch) {
      const query = currentSearch.toLowerCase();
      filtered = filtered.filter(ch => ch.name.toLowerCase().includes(query));
    }
    renderChannels(filtered);
  }

  function renderChannels(channels) {
    container.innerHTML = '';
    if (channels.length === 0) {
      container.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:20px;">لا توجد نتائج</div>';
      return;
    }
    const displayLimit = 300;
    channels.slice(0, displayLimit).forEach(ch => {
      const card = document.createElement('div');
      card.className = `channel-card ${currentPlayingId === ch.id ? 'active' : ''}`;
      card.innerHTML = `
        <span class="channel-icon">
          ${ch.logo ? `<img src="${ch.logo}" class="channel-logo" onerror="this.style.display='none';">` : '<i class="fa-solid fa-tv" style="font-size:26px;"></i>'}
        </span>
        <div class="channel-name">${ch.name}</div>
        <div class="channel-cat">${ch.cat}</div>
      `;
      card.onclick = () => selectChannel(ch);
      container.appendChild(card);
    });
  }

  function selectChannel(channel) {
    currentPlayingId = channel.id;
    updateView();
    showEPGForChannel(channel); // عرض معلومات البرنامج

    loadingOverlay.style.display = 'flex';
    if (hls) { hls.destroy(); hls = null; }
    video.pause();
    video.removeAttribute('src');
    video.load();

    let finalUrl = channel.url;
    if (finalUrl.startsWith('http://')) finalUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(channel.url);

    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ enableWorker: true });
      hls.loadSource(finalUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        loadingOverlay.style.display = 'none';
        video.play().catch(() => {});
      });
      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) { loadingOverlay.style.display = 'none'; showToast('تعذر تشغيل القناة'); hls.destroy(); hls = null; }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = finalUrl;
      video.addEventListener('loadedmetadata', () => { loadingOverlay.style.display = 'none'; video.play(); });
    }
  }

  function showToast(msg) {
    const div = document.createElement('div');
    div.style = "position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#ff003c; color:#fff; padding:10px 20px; border-radius:8px; z-index:1000;";
    div.innerText = msg;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 3000);
  }

  function toggleFullscreen() {
    const wrap = document.querySelector('.video-wrapper');
    if (!document.fullscreenElement) wrap.requestFullscreen?.();
    else document.exitFullscreen?.();
  }

  // بدء التحميل
  loadEPG(); // جلب البرامج أولاً
  loadM3UPlaylist(); // جلب القنوات

</script>
</body>
</html>
